<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Scientific Research System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            grid-column: 1 / -1;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #bee5eb;
        }

        .response-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            margin-top: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }

        .citation {
            background: #f8f9fa;
            padding: 15px;
            margin: 10px 0;
            border-left: 3px solid #667eea;
            border-radius: 3px;
        }

        .citation-source {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .citation-text {
            color: #666;
            font-size: 13px;
            font-style: italic;
        }

        .confidence-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin: 5px 5px 5px 0;
        }

        .confidence-high {
            background: #d4edda;
            color: #155724;
        }

        .confidence-medium {
            background: #fff3cd;
            color: #856404;
        }

        .confidence-low {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🔬 RAG Scientific Research System</h1>
            <p>Evidence-Grounded Answers with Complete Audit Trails</p>
        </div>

        <!-- Config Panel -->
        <div id="configPanel" class="card">
            <h2>🔑 Configure API</h2>
            <div class="form-group">
                <label for="apiKey">Anthropic API Key</label>
                <input type="password" id="apiKey" placeholder="sk-ant-..." />
                <p style="color: #666; font-size: 12px; margin-top: 5px;">
                    Get your key from <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>
                </p>
            </div>
            <div class="button-group">
                <button class="btn-primary" onclick="configureApi()">✓ Configure API</button>
                <button class="btn-secondary" onclick="useDemoMode()">🧪 Use Demo Mode</button>
            </div>
            <div id="configError" class="error hidden"></div>
        </div>

        <!-- API Configured Badge -->
        <div id="configSuccess" class="info hidden">
            ✓ API Configured <span id="modeLabel"></span>
            <button class="btn-secondary" style="float: right;" onclick="resetApi()">Change API</button>
        </div>

        <!-- Query Form -->
        <div id="queryPanel" class="card hidden">
            <h2>❓ Submit Research Query</h2>

            <div class="form-group">
                <label for="question">Research Question *</label>
                <input type="text" id="question" placeholder="e.g., What is the efficacy of drug X for condition Y?" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="domain">Domain *</label>
                    <select id="domain">
                        <option value="">Select Domain</option>
                        <option value="pharmacology">Pharmacology</option>
                        <option value="immunology">Immunology</option>
                        <option value="oncology">Oncology</option>
                        <option value="infectious_disease">Infectious Disease</option>
                        <option value="cardiology">Cardiology</option>
                        <option value="neurology">Neurology</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="userId">Your ID *</label>
                    <input type="text" id="userId" placeholder="researcher_01" />
                </div>
            </div>

            <div class="form-group">
                <label for="context">Context (Optional)</label>
                <textarea id="context" placeholder="Additional context about your research..."></textarea>
            </div>

            <button class="btn-primary" onclick="submitQuery()">🚀 Submit Query</button>
            <div id="queryError" class="error hidden"></div>
        </div>

        <!-- Results -->
        <div id="resultsPanel" class="card hidden">
            <h2>📊 Research Response</h2>

            <div style="margin-bottom: 20px;">
                <strong>Audit ID:</strong> <span id="auditId" style="font-family: monospace;"></span>
                <div style="margin-top: 10px;">
                    <span id="confidenceBadge" class="confidence-badge"></span>
                </div>
            </div>

            <h3 style="color: #333; margin: 20px 0 10px 0;">Answer</h3>
            <div id="answerBox" class="response-box"></div>

            <h3 style="color: #333; margin: 20px 0 10px 0;">Citations</h3>
            <div id="citationsBox"></div>

            <h3 style="color: #333; margin: 20px 0 10px 0;">Knowledge Gaps</h3>
            <div id="gapsBox"></div>

            <div style="margin-top: 20px;">
                <button class="btn-primary" onclick="resetForm()" style="grid-column: auto;">🔄 New Query</button>
                <button class="btn-secondary" onclick="exportAudit()" style="margin-left: 10px;">📥 Export Audit Trail</button>
            </div>
        </div>
    </div>

    <script>
        let apiKeyConfigured = false;
        let currentApiKey = null;
        let usingStubMode = false;

        function configureApi() {
            const apiKey = document.getElementById('apiKey').value;
            if (!apiKey) {
                showError('configError', 'Please enter your Anthropic API key');
                return;
            }
            apiKeyConfigured = true;
            currentApiKey = apiKey;
            usingStubMode = false;
            showConfigured('(Anthropic API)');
        }

        function useDemoMode() {
            apiKeyConfigured = true;
            currentApiKey = null;
            usingStubMode = true;
            showConfigured('(Demo Mode)');
        }

        function showConfigured(label) {
            document.getElementById('configPanel').classList.add('hidden');
            document.getElementById('configSuccess').classList.remove('hidden');
            document.getElementById('modeLabel').textContent = label;
            document.getElementById('queryPanel').classList.remove('hidden');
        }

        function resetApi() {
            apiKeyConfigured = false;
            currentApiKey = null;
            usingStubMode = false;
            document.getElementById('apiKey').value = '';
            document.getElementById('configPanel').classList.remove('hidden');
            document.getElementById('configSuccess').classList.add('hidden');
            document.getElementById('queryPanel').classList.add('hidden');
            document.getElementById('resultsPanel').classList.add('hidden');
            document.getElementById('configError').classList.add('hidden');
        }

        async function submitQuery() {
            const question = document.getElementById('question').value;
            const domain = document.getElementById('domain').value;
            const userId = document.getElementById('userId').value;
            const context = document.getElementById('context').value;

            if (!question || !domain || !userId) {
                showError('queryError', 'Please fill in all required fields');
                return;
            }

            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>Analyzing...';

            try {
                const params = new URLSearchParams({
                    question,
                    domain,
                    user_id: userId,
                    context,
                    use_stub: usingStubMode ? 'true' : 'false',
                    ...(currentApiKey && { api_key: currentApiKey })
                });

                const response = await fetch(`/api/query?${params}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to submit query');
                }

                const data = await response.json();
                displayResults(data);
                document.getElementById('queryError').classList.add('hidden');
            } catch (error) {
                showError('queryError', error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🚀 Submit Query';
            }
        }

        function displayResults(data) {
            document.getElementById('resultsPanel').classList.remove('hidden');
            document.getElementById('auditId').textContent = data.audit_id;

            // Confidence badge
            const badge = document.getElementById('confidenceBadge');
            badge.textContent = data.confidence.toUpperCase() + ' Confidence';
            badge.className = `confidence-badge confidence-${data.confidence}`;

            // Answer
            document.getElementById('answerBox').textContent = data.answer;

            // Citations
            const citationsBox = document.getElementById('citationsBox');
            if (data.citations && data.citations.length) {
                citationsBox.innerHTML = data.citations.map((c, i) => `
                    <div class="citation">
                        <div class="citation-source">${i + 1}. [${c.source_id}] ${c.source_name}</div>
                        <div class="citation-text">"${c.text}"</div>
                        <div style="margin-top: 8px; font-size: 12px; color: #666;">
                            Confidence: ${(c.confidence * 100).toFixed(0)}% |
                            ${c.validated ? '✓ Validated' : '⚠ Unvalidated'}
                        </div>
                    </div>
                `).join('');
            } else {
                citationsBox.innerHTML = '<p style="color: #666;">No citations available</p>';
            }

            // Gaps
            const gapsBox = document.getElementById('gapsBox');
            if (data.gaps && data.gaps.length) {
                gapsBox.innerHTML = data.gaps.map(g =>
                    `<div style="color: #666; margin-bottom: 8px;">• ${g}</div>`
                ).join('');
            } else {
                gapsBox.innerHTML = '<p style="color: #666;">No gaps identified</p>';
            }

            // Store for export
            window.currentResponse = data;
        }

        function resetForm() {
            document.getElementById('question').value = '';
            document.getElementById('domain').value = '';
            document.getElementById('userId').value = '';
            document.getElementById('context').value = '';
            document.getElementById('resultsPanel').classList.add('hidden');
        }

        async function exportAudit() {
            if (!window.currentResponse) return;

            try {
                const data = await fetch(`/api/audit/${window.currentResponse.audit_id}`).then(r => r.json());
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `audit_${window.currentResponse.audit_id}.json`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (error) {
                showError('error', 'Failed to export audit trail');
            }
        }

        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.remove('hidden');
        }
    </script>
</body>
</html>
