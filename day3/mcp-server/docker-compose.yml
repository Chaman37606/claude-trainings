version: '3.8'

services:
  mcp-server:
    build: .
    ports:
      - "3001:3001"
      - "3000:3000"
    environment:
      - MCP_PORT=3001
      - UI_PORT=3000
      - SEARCH_PROVIDER=duckduckgo
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    restart: unless-stopped
