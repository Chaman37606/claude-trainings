version: '3.8'

services:
  backend:
    build: .
    container_name: eli-lilly-qc-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./alcoa_qc.db
    volumes:
      - ./alcoa_qc.db:/app/alcoa_qc.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    image: nginx:alpine
    container_name: eli-lilly-qc-ui
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db:
    driver: local
