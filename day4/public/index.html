<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SIP Calculator</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 640px; margin: 2rem auto; }
      label { display:block; margin-top: .5rem }
      input { width: 100%; padding: .5rem; font-size: 1rem }
      button { margin-top: .75rem; padding: .5rem 1rem }
      .result { margin-top: 1rem; font-weight: bold }
    </style>
  </head>
  <body>
    <h1>SIP Calculator</h1>
    <div>
      <label>Monthly amount
        <input id="amount" type="number" value="5000" />
      </label>
      <label>Expected annual return (%)
        <input id="rate" type="number" value="12" step="0.01" />
      </label>
      <label>Tenure (years)
        <input id="years" type="number" value="10" />
      </label>
      <button id="calc">Calculate (Standard)</button>
      <button id="calcAgent">Calculate (Agent)</button>
      <div class="result" id="result"></div>
    </div>

    <hr />
    <h2>Fetch Fund NAV (via mCP client)</h2>
    <label>Fund ID (example: 119086 for ICICI Prudential Bluechip)
      <input id="fundId" type="text" placeholder="enter fund id" />
    </label>
    <button id="fetchNav">Fetch NAV</button>
    <pre id="navResult"></pre>

    <script src="/app.js"></script>
  </body>
</html>
